name: Database validation

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-database-validation
  cancel-in-progress: false

jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:test-tooling
      - run: pnpm lint && pnpm typecheck && pnpm format:check

  hosted:
    if: github.event_name == 'workflow_dispatch'
    needs: tooling
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate authorized disposable hosted targets
        run: pnpm db:validate
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MYCLINICS_DISPOSABLE_AUTHORIZATION: njnmfutclorywskqrftd
